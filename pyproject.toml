[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "argus-forge"
dynamic = ["version"]
description = "Training bridge: turn curated dataset exports into ready-to-run LoRA training configs (kohya_ss / OneTrainer / diffusers)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "smk762" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "structlog>=24.0",
    # The suite's shared target taxonomy (argus_cortex.taxonomy) and the GPU
    # lease (argus_cortex.gpu). 0.13 is the first that reads a curator speech
    # export: 0.12 added TargetProfile.modality and the speech categories, 0.13
    # the consent:<release_sha256> subject ref curator writes into a consented
    # speech row's provenance. Capped below the next untested minor: cortex is pre-1.0, where a
    # minor bump may break. The bare package pulls only pydantic.
    "argus-cortex>=0.16.1,<0.17",
]

[project.optional-dependencies]
# argus-cortex[server] carries the suite's shared write-guard and env-flag
# helpers (argus_cortex.server); it pulls starlette, which fastapi provides too.
server = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.7", "argus-cortex[server]>=0.16.1,<0.17"]
# The GPU lease a run takes: [remote] is the argus-iris broker client (httpx),
# [yaml] reads gpu-tenant.yaml, [gpu] is NVML for the peak-VRAM report. Without
# it the broker (ARGUS_GPU_BROKER_URL) cannot lease, and no peak is reported.
gpu = ["argus-cortex[gpu,remote,yaml]>=0.16.1,<0.17"]
cli = ["typer>=0.12", "rich>=13.0"]
dev = ["pytest>=8.0", "argus-cortex[remote,yaml]>=0.16.1,<0.17", "pytest-asyncio>=0.23", "ruff==0.15.16", "httpx>=0.27", "httpx2>=2.7", "certifi>=2026.10.19"]

[project.scripts]
argus-forge = "argus_forge.cli:app"

[project.urls]
Repository = "https://github.com/smk762/argus-forge"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/argus_forge/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/argus_forge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["src/argus_forge/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]
