# Optional: mount the suite settings file (argus_cortex.settings) into the forge container, read-only.
#
#   python -m argus_cortex.settings --init                        # creates ~/.config/argus/suite.env, mode 600
#   COMPOSE_FILE=docker-compose.yaml:compose.suite.yaml           # in .env, or pass both files with -f
#
# A separate file because compose cannot make a bind mount optional: with it in docker-compose.yaml, a host
# without a suite file would not start. Anything set in .env or the environment still wins.
#
# Known limit (smk762/argus-cortex#218): argus-cortex reads the file only when it belongs to the user the
# process runs as, or to root. The forge image runs as root and a root process refuses a file owned by another
# user, so today the mounted file must be owned by root (mode 600); otherwise it is ignored with a warning.
#
# What forge takes from it: the GPU broker URL and token (ARGUS_GPU_BROKER_URL, ARGUS_GPU_BROKER_TOKEN) and the
# other ARGUS_GPU_* settings, read inside the server process. Forge never copies the file into its environment,
# so the trainer inherits none of its values (an HF_TOKEN for the trainer still goes in the server's own environment).
# The trainer runs in this container as the same user, though, so it can open the mounted file, just as it can
# already read the server's own environment: the environment filter is defence in depth, not a sandbox. On a
# host that trains (the -train image, ARGUS_FORGE_READONLY=0), mount a suite file only if you would trust the
# trainer's code with what is in it.
services:
  argus-forge:
    volumes:
      - type: bind
        source: "${ARGUS_SUITE_ENV:-${HOME}/.config/argus/suite.env}"
        target: /etc/argus/suite.env
        read_only: true
        bind: {create_host_path: false}
